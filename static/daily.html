<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <link rel="stylesheet" href="/static/style.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
        <link href="https://fonts.google.com/share?selection.family=Figtree:ital,wght@0,300..900;1,300..900" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <title>Daily Challenge</title>
    </head>
    <body class="daily-page">
        <div id="nav-bar">
            <div id="dailyButton">Daily Challenge</div>
            <div id="mainTitle"><h1>list baseball players</h1></div>
            <div id="aboutButton" href="/about">About</div>
        </div>
        <h1 id="dailyDate"></h1>
        <div class="calendarContainer">
            <div class="calendar">
                <div class="header">
                    <button id="prevBtn">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div class="monthYear" id="monthYear"></div>
                    <button id="nextBtn">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
                <div class="days">
                    <div class="day">Mon</div>
                    <div class="day">Tue</div>
                    <div class="day">Wed</div>
                    <div class="day">Thur</div>
                    <div class="day">Fri</div>
                    <div class="day">Sat</div>
                    <div class="day">Sun</div>
                </div>
                <div class="dates" id="dates"></div>
            </div>
        </div>
        <div id="todayTitle">
            <p>Click the date for previous challenges!</p>
        </div>
        <div id="challenge">
            <p id="todaysChallenge">Past and Present Mets Players (1871-2025)</p>
            <div class="scoreboard">
                <h3 class="scorebug"><span id="score">0</span></h3>
                <h4 class="scorebug">Time: <span id="timer">60</span></h4>
            </div>
            <form id="inputForm">
                <input type="text" id="inputPlayer">
            </form>
            <div id="tryAgain"></div>
        </div>
            <div class="guessed">
                <h2>Guessed Players</h2>
                <div id="guessedList"></div>
            </div>
        <script src="/static/script.js"></script>
    </body>
</html>
